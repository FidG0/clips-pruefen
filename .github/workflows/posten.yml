name: Posten (Freigaben -> Buffer)
# Sofort bei jeder "Posten"-Freigabe und zusätzlich alle 15 Minuten: Freigaben in den nächsten Slot (13:00/16:00/19:00/20:30, Bonus 22:00 nur auf Wunsch) planen.
# Ohne Secret BUFFER_LIVE=ja nur Probelauf. Gesperrt bleibt: Ton-Ampel nicht grün, alte Charge ohne Original, Glücksspiel.
# Gestartet von Supabase (pg_cron + Trigger auf auftraege, Funktion public.github_dispatch), GitHub-Zeitpläne feuerten in diesem Repo nie.
on:
  workflow_dispatch:
concurrency: posting
permissions:
  contents: read
jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_LIVE: ${{ secrets.BUFFER_LIVE }}
    steps:
      - uses: actions/checkout@v4
      - name: Planen
        if: env.SUPABASE_SECRET != ''
        working-directory: automation
        run: python3 posten.py
      - name: Noch nicht eingerichtet
        if: env.SUPABASE_SECRET == ''
        run: echo "Secret SUPABASE_SECRET fehlt, Job übersprungen."
