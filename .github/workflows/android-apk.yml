name: Android-App bauen

# Baut die Clipwreck-Handy-App als UNSIGNIERTE APK. Signiert wird lokal auf Marvins PC,
# der Schlüssel (Keystore) liegt nie in GitHub.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Ausrichten und Signierwerkzeug beilegen
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p aus
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aus/clipwreck-unsigniert.apk
          cp "$BT/lib/apksigner.jar" aus/apksigner.jar
          echo "1.0.${{ github.run_number }}" > aus/version.txt
          ls -la aus
      - uses: actions/upload-artifact@v4
        with:
          name: clipwreck-apk-unsigniert
          path: aus/
          retention-days: 14
