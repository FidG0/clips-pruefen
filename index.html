<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Clips Prüfen</title>
<style>
  :root { --bg:#14111c; --karte:#1f1a2b; --linie:#352d48; --text:#f2eefa; --leise:#a99fbd; --gruen:#4ade80; --rot:#f87171; --gelb:#fbbf24; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 8px; border-bottom:1px solid var(--linie); }
  header h1 { margin:0; font-size:18px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #pcstand { font-size:12px; color:var(--leise); font-weight:400; }
  nav { display:flex; gap:6px; margin-top:8px; }
  nav button { flex:1; padding:8px 4px; font-size:14px; }
  main { padding:12px 16px 40px; max-width:560px; margin:0 auto; }
  button, input, textarea { font:inherit; color:inherit; }
  button { background:var(--karte); border:1px solid var(--linie); border-radius:10px; padding:10px 12px; cursor:pointer; }
  button.an { border-color:var(--text); }
  button.ja { background:var(--gruen); color:#0b1a10; border:0; font-weight:600; }
  button.nein { background:transparent; border-color:var(--rot); color:var(--rot); }
  input, textarea { width:100%; background:#0f0c16; border:1px solid var(--linie); border-radius:10px; padding:10px; }
  textarea { min-height:64px; resize:vertical; }
  .karte { background:var(--karte); border:1px solid var(--linie); border-radius:14px; padding:12px; margin-bottom:16px; }
  .karte video { width:100%; max-height:70vh; background:#000; border-radius:10px; display:block; }
  .kopf { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--leise); margin:8px 0 2px; }
  .titel { font-weight:650; margin:2px 0 6px; }
  .caption { white-space:pre-wrap; font-size:14px; color:var(--leise); max-height:7em; overflow:auto; }
  .hinweis { font-size:13px; color:var(--gelb); margin-top:6px; }
  .knoepfe { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .knoepfe .posten { grid-column:1 / -1; }
  .mehr { margin-top:8px; display:grid; gap:8px; }
  .leer { color:var(--leise); text-align:center; padding:40px 0; }
  .zeile { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--linie); font-size:14px; }
  .zeile span:last-child { color:var(--leise); white-space:nowrap; }
  #login { display:grid; gap:10px; margin-top:20vh; }
  .fehler { color:var(--rot); font-size:14px; }

  nav { overflow-x:auto; scrollbar-width:none; }
  nav button { flex:0 0 auto; padding:8px 12px; }
  #abmelden { margin-left:auto; color:var(--leise); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .chips button { flex:0 0 auto; padding:6px 12px; border-radius:99px; font-size:14px; }
  .chips button.an { background:var(--text); color:#14111c; border-color:var(--text); }
  .suche { margin-bottom:8px; }
  .ampel { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 2px; font-size:12px; color:var(--leise); }
  .ampel span { display:inline-flex; align-items:center; gap:5px; }
  .ampel i { width:11px; height:11px; border-radius:50%; background:#4b4560; display:inline-block; }
  .ampel .gruen i { background:var(--gruen); } .ampel .gelb i { background:var(--gelb); } .ampel .rot i { background:var(--rot); }
  .stapel { position:relative; touch-action:pan-y; transition:transform .18s ease, box-shadow .18s; will-change:transform; }
  .stapel.ziehen { transition:none; }
  .stapel.t-ja { box-shadow:0 0 0 3px var(--gruen); } .stapel.t-nein { box-shadow:0 0 0 3px var(--rot); } .stapel.t-edit { box-shadow:0 0 0 3px var(--gelb); }
  .zaehler { display:flex; justify-content:space-between; font-size:13px; color:var(--leise); margin-bottom:8px; }
  .gruende { display:flex; flex-wrap:wrap; gap:6px; }
  .gruende button { padding:5px 10px; font-size:13px; border-radius:99px; }
  .gruende button.an { border-color:var(--gelb); color:var(--gelb); }
  .tipp { font-size:12px; color:var(--leise); text-align:center; margin-top:10px; }
  .tastenhilfe { display:none; }
  @media (hover:hover) and (pointer:fine) { .tastenhilfe { display:block; } }
  .knoepfe3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
  .klein { padding:6px 10px; font-size:13px; }
  .reihe { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .status { font-size:12px; border:1px solid var(--linie); border-radius:99px; padding:1px 8px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#2c2540; border:1px solid var(--linie); border-radius:12px; padding:10px 14px; display:flex; gap:12px; align-items:center; z-index:20; max-width:92vw; }
  .platz { aspect-ratio:9/16; max-height:60vh; width:100%; background:#000; border-radius:10px; display:grid; place-items:center; color:var(--leise); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Clips Prüfen <span id="pcstand"></span></h1>
  <nav id="nav" hidden>
    <button data-ansicht="pruefen" class="an">Prüfen</button>
    <button data-ansicht="clips">Clips</button>
    <button data-ansicht="fertig">Fertig</button>
    <button data-ansicht="erledigt">Erledigt</button>
    <button data-ansicht="videos">Videos</button>
    <button data-ansicht="posting">Posting</button>
    <button id="abmelden">Abmelden</button>
  </nav>
</header>
<main>
  <form id="login" hidden>
    <input id="mail" type="email" autocomplete="username" placeholder="E-Mail" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="ja" type="submit">Anmelden</button>
    <div id="loginfehler" class="fehler"></div>
  </form>
  <div id="inhalt"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_ = "https://ycmecdixsdfhcspqeinw.supabase.co";
const KEY = "sb_publishable_cyLyZvgu7N2RbPv58E7aBA_AigcopE6";   // öffentlich gedacht, Schutz über Login + Zeilenschutz
const sb = supabase.createClient(URL_, KEY);
let ansicht = "pruefen";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function start() {
  const { data } = await sb.auth.getSession();
  $("#login").hidden = !!data.session; $("#nav").hidden = !data.session;
  if (data.session) zeige();
}
$("#login").onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("#mail").value.trim(), password: $("#pw").value });
  $("#loginfehler").textContent = error ? "Anmeldung fehlgeschlagen: " + error.message : "";
  if (!error) start();
};
$("#abmelden").onclick = async () => { await sb.auth.signOut(); $("#inhalt").innerHTML = ""; start(); };
document.querySelectorAll("nav [data-ansicht]").forEach(b => b.onclick = () => {
  ansicht = b.dataset.ansicht; document.querySelectorAll("nav [data-ansicht]").forEach(x => x.classList.toggle("an", x === b)); zeige();
});

async function pcStand() {
  const { data } = await sb.from("info").select("wert").eq("schluessel", "pc").maybeSingle();
  const t = data?.wert?.letzter_abgleich;
  if (!t) return $("#pcstand").textContent = "";
  const min = Math.round((Date.now() / 1000 - t) / 60);
  const an = min <= 2;
  $("#pcstand").innerHTML = an ? `<a href="${PC}" style="color:var(--gruen)">PC an: volles Dashboard</a>` : "PC aus (zuletzt vor " + (min < 120 ? min + " Min" : Math.round(min / 60) + " Std") + ")";
  // Eine Adresse für alles: PC an = einmal pro Sitzung automatisch ins volle Dashboard (über Tailscale).
  // Klappt das nicht (Tailscale-App aus), führt „Zurück“ hierher und es wird nicht erneut umgeleitet.
  const bleiben = new URLSearchParams(location.search).has("pruefen");
  let versucht = false; try { versucht = sessionStorage.getItem("pc_versucht") === "1"; } catch (e) {}
  if (an && !bleiben && !versucht) {
    try { sessionStorage.setItem("pc_versucht", "1"); } catch (e) {}
    location.href = PC;
  }
}
const PC = "http://100.93.141.24:8800/";
const MARKER = "[posten]";

async function zeige() {
  pcStand();
  const ziel = $("#inhalt");
  if (ansicht === "videos") {
    const { data } = await sb.from("info").select("wert").eq("schluessel", "videos").maybeSingle();
    const a = data?.wert?.aktuell, l = data?.wert?.liste || [];
    ziel.innerHTML = (a ? `<div class="karte"><b>Gerade in Arbeit:</b> ${esc(a.titel)} <span style="color:var(--leise)">· ${esc(a.kanal)}</span><br>Schritt: ${esc(a.schritt)}${a.fortschritt != null ? " · " + a.fortschritt + " %" : ""}</div>`
      : `<p class="leer" style="padding:12px 0">Gerade kein Video in Arbeit.</p>`)
      + l.map(v => `<div class="zeile"><span><b style="color:${v.ergebnis === "genommen" ? "var(--gruen)" : "var(--leise)"}">${esc(v.ergebnis)}</b> ${esc(v.titel)}<br><small>${esc(v.grund)}</small></span><span>${esc(v.kanal)}</span></div>`).join("");
    return;
  }
  if (ansicht === "posting") {
    const [{ data: p }, { data: a }] = await Promise.all([
      sb.from("info").select("wert").eq("schluessel", "posting").maybeSingle(),
      sb.from("info").select("wert").eq("schluessel", "auswertung").maybeSingle()]);
    const po = p?.wert || {}, au = a?.wert || {};
    const farbe = { geplant: "var(--gelb)", gesendet: "var(--gruen)", fehler: "var(--rot)", probelauf: "var(--leise)" };
    const zeile = g => `<div class="zeile"><span><b style="color:${farbe[g.status] || "var(--leise)"}">${esc(g.status)}</b> ${esc({ tiktok: "TikTok", youtube: "YouTube", instagram: "Insta" }[g.plattform || "tiktok"] || g.plattform)} · ${esc(g.titel)}${g.fehler ? "<br><small style='color:var(--rot)'>" + esc(g.fehler) + "</small>" : ""}</span><span>${esc(g.slot_lokal)}</span></div>`;
    const kommend = (po.geplant || []).filter(g => g.status !== "gesendet").slice(-20).reverse();
    const gesendet = (po.geplant || []).filter(g => g.status === "gesendet").slice(-10).reverse();
    ziel.innerHTML = `<div class="karte"><b>Modus:</b> ${po.modus === "live" ? "<span style='color:var(--gruen)'>live (Buffer)</span>" : "Probelauf, es wird nichts gepostet"}
        ${po.letzter_lauf ? "<br><small style='color:var(--leise)'>Letzter Lauf: " + new Date(po.letzter_lauf).toLocaleString("de-DE") + "</small>" : ""}</div>`
      + ((po.probelauf || []).length ? `<h3>Würde geplant (Probelauf)</h3>` + po.probelauf.map(zeile).join("") : "")
      + `<h3>Geplant</h3>` + (kommend.length ? kommend.map(zeile).join("") : `<p class="leer" style="padding:12px 0">Nichts geplant.</p>`)
      + (gesendet.length ? `<h3>Gesendet</h3>` + gesendet.map(zeile).join("") : "")
      + `<h3>Zahlen</h3>` + (au.anzahl_posts ? `<div class="karte">${au.anzahl_posts} Posts · Median ${Math.round(au.median_views_d3 || 0).toLocaleString("de-DE")} Views (Tag 3)
          ${(au.vorschlaege || []).map(t => `<div class="hinweis">• ${esc(t)}</div>`).join("")}</div>`
          + (au.top || []).map(t => `<div class="zeile"><span>${esc(t.titel)}<br><small>${esc(t.plattform || "")} · ${esc(t.art || "")} · ${esc(t.slot || "")}</small></span><span>${Math.round(t.views_d3).toLocaleString("de-DE")}</span></div>`).join("")
        : `<p class="leer" style="padding:12px 0">Noch keine Zahlen.</p>`);
    return;
  }
  if (ansicht === "erledigt") {
    const { data, error } = await sb.from("auftraege").select("id,aktion,kommentar,erstellt,erledigt,ergebnis,karten(titel)").order("id", { ascending: false }).limit(40);
    if (error) return ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`;
    const name = { behalten: "Behalten", ablehnen: "Nicht behalten", ueberarbeiten: "Überarbeiten" };
    ziel.innerHTML = data.length ? data.map(a => { const p = (a.kommentar || "").startsWith(MARKER); const kom = p ? a.kommentar.slice(MARKER.length).trim() : a.kommentar;
      return `<div class="zeile"><span>${p ? "Posten" : name[a.aktion]}: ${esc(a.karten?.titel)}${kom ? "<br><small>„" + esc(kom) + "“</small>" : ""}</span>
      <span>${a.erledigt ? "am PC erledigt" : "wartet auf PC"}</span></div>`; }).join("") : `<p class="leer">Noch keine Entscheidungen.</p>`;
    return;
  }
  if (ansicht === "fertig") {   // 24.11.: fertige Clips auch bei ausgeschaltetem PC
    const { data: k, error } = await sb.from("karten").select("*").eq("status", "fertig").not("vorschau", "is", null).order("zeit", { ascending: false });
    if (error) return ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`;
    if (!k.length) return ziel.innerHTML = `<p class="leer">Noch keine fertigen Clips in der Cloud. Der PC lädt sie nach und nach hoch.</p>`;
    ziel.innerHTML = `<p style="color:var(--leise);font-size:14px">${k.length} fertige Clips, auch ohne PC. Video lädt erst beim Antippen.</p>` + k.map(c => `<div class="karte">
      <video controls playsinline preload="none" data-pfad="${esc(c.vorschau)}"></video>
      <div class="kopf"><span>${esc(c.kanal)}</span><span>${(c.hinweise || []).map(esc).join(" ")}</span></div>
      <div class="titel">${esc(c.titel)}</div>
      <div class="caption">${esc(c.caption)}</div>
      <div class="knoepfe" style="grid-template-columns:1fr 1fr"><a class="laden" data-pfad="${esc(c.vorschau)}" href="#"><button class="ja" style="width:100%">Herunterladen</button></a>
      <button class="kopieren">Text kopieren</button></div></div>`).join("");
    const pfade = k.map(c => c.vorschau);
    const [{ data: ansehen }, { data: laden }] = await Promise.all([
      sb.storage.from("vorschau").createSignedUrls(pfade, 3600),
      sb.storage.from("vorschau").createSignedUrls(pfade, 3600, { download: true })]);
    const a = Object.fromEntries((ansehen || []).map(l => [l.path, l.signedUrl])), d = Object.fromEntries((laden || []).map(l => [l.path, l.signedUrl]));
    ziel.querySelectorAll("video[data-pfad]").forEach(v => { if (a[v.dataset.pfad]) v.src = a[v.dataset.pfad]; });
    ziel.querySelectorAll("a.laden").forEach(x => { if (d[x.dataset.pfad]) x.href = d[x.dataset.pfad]; });
    ziel.querySelectorAll(".kopieren").forEach((b, i) => b.onclick = async () => {
      try { await navigator.clipboard.writeText(k[i].caption || k[i].titel || ""); b.textContent = "Kopiert ✓"; } catch (e) { alert(k[i].caption); }
    });
    return;
  }
  if (ansicht === "clips") return clipsListe(ziel);
  return pruefenQueue(ziel);
}

// ---------- gemeinsame Helfer ----------
const BUCKET_VORSCHAU = "vorschau";
const urlCache = new Map();
async function signiert(bucket, pfad, download) {
  if (!pfad) return null;
  const key = bucket + "|" + pfad + "|" + (download || "");
  const c = urlCache.get(key);
  if (c && c.bis > Date.now()) return c.url;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(pfad, 3600, download ? { download } : undefined);
  if (error || !data) return null;
  urlCache.set(key, { url: data.signedUrl, bis: Date.now() + 3300 * 1000 });
  return data.signedUrl;
}
// 480p-Vorschau bevorzugt (Feld vorschau_480), sonst die normale Vorschau. Die PC-Pipeline füllt vorschau_480 später.
const vorschauPfad = k => k.vorschau_480 || k.vorschau;

// Qualitäts-Ampel. Felder in karten.checks (jsonb), die die PC-Pipeline später füllt:
//   { ton_sync: {status, ms}, laenge: {status, s}, untertitel: {status, hinweis} }   status: gruen | gelb | rot
// Länge wird zur Not selbst berechnet (Regelwerk v3: 10 bis 35 s). Fehlt ein Wert, bleibt der Punkt grau.
function ampel(k, gemessen) {
  const c = k.checks || {};
  const dauer = gemessen ?? k.dauer ?? c.laenge?.s;
  let laenge = c.laenge?.status;
  if (!laenge && dauer != null) laenge = dauer >= 10 && dauer <= 35 ? "gruen" : (dauer >= 8 && dauer <= 40 ? "gelb" : "rot");
  const teile = [
    ["Ton", c.ton_sync?.status, c.ton_sync?.ms != null ? `Versatz ${c.ton_sync.ms} ms` : "Ton-Sync noch nicht geprüft"],
    ["Länge", laenge, dauer != null ? `${Math.round(dauer * 10) / 10} s (Ziel 10 bis 35 s)` : "Länge unbekannt"],
    ["Text", c.untertitel?.status, c.untertitel?.hinweis || "Untertitel noch nicht geprüft"]];
  return `<div class="ampel">${teile.map(([n, s, t]) => `<span class="${esc(s || "")}" title="${esc(t)}"><i></i>${n}</span>`).join("")}</div>`;
}
function toast(text, undo) {
  let t = $("#toast"); if (t) t.remove();
  t = document.createElement("div"); t.id = "toast"; t.textContent = text;
  if (undo) { const b = document.createElement("button"); b.className = "klein"; b.textContent = "Rückgängig"; b.onclick = () => { undo(); t.remove(); }; t.append(b); }
  document.body.append(t); setTimeout(() => t.remove(), 6000);
}
// ---------- Clips: eine Liste mit Formatfiltern und Suche ----------
const FORMATE = { "Alle": [], "GTA": ["gta"], "Best of": ["best of", "best-of", "bestof"], "IRL": ["irl"], "Top-5": ["top 5", "top5", "top-5"] };
const clipsZustand = { format: "Alle", status: "alle", q: "", seite: 0, daten: [] };
const SEITE = 30;
function formatVon(k) {
  const t = `${k.format || ""} ${k.art || ""} ${k.titel || ""}`.toLowerCase();
  for (const [n, w] of Object.entries(FORMATE)) if (w.some(x => t.includes(x))) return n;
  return "";
}
async function clipsListe(ziel, mehr) {
  const z = clipsZustand;
  if (!mehr) { z.seite = 0; z.daten = []; }
  if (!$("#clipsKopf")) {
    ziel.innerHTML = `<div id="clipsKopf"><input id="clipsQ" class="suche" type="search" placeholder="Suchen (Titel, Kanal, Art)" value="${esc(z.q)}">
      <div class="chips" id="fChips">${Object.keys(FORMATE).map(n => `<button data-f="${esc(n)}" class="${n === z.format ? "an" : ""}">${esc(n)}</button>`).join("")}</div>
      <div class="chips" id="sChips"></div></div><div id="clipsListe"></div><div id="clipsMehr"></div>`;
    let tm; $("#clipsQ").oninput = e => { clearTimeout(tm); tm = setTimeout(() => { z.q = e.target.value; clipsListe(ziel); }, 350); };
    $("#fChips").onclick = e => { const f = e.target.dataset?.f; if (!f) return; z.format = f; $("#fChips").querySelectorAll("button").forEach(b => b.classList.toggle("an", b.dataset.f === f)); clipsListe(ziel); };
    $("#sChips").onclick = e => { const s = e.target.dataset?.s; if (!s) return; z.status = s; clipsListe(ziel); };
  }
  let q = sb.from("karten").select("*").order("zeit", { ascending: false }).range(z.seite * SEITE, z.seite * SEITE + SEITE - 1);
  if (z.status !== "alle") q = q.eq("status", z.status);
  const muster = FORMATE[z.format];
  if (muster.length) q = q.or(muster.flatMap(m => [`titel.ilike.%${m}%`, `art.ilike.%${m}%`]).join(","));
  const such = z.q.replace(/[,()%*]/g, " ").trim();
  if (such) q = q.or(["titel", "kanal", "art"].map(c => `${c}.ilike.%${such}%`).join(","));
  const { data, error } = await q;
  if (error) { $("#clipsListe").innerHTML = `<p class="fehler">${esc(error.message)}</p>`; return; }
  z.daten = mehr ? z.daten.concat(data) : data;
  const stati = ["alle", ...new Set(z.daten.map(k => k.status).filter(Boolean))];
  $("#sChips").innerHTML = stati.map(s => `<button data-s="${esc(s)}" class="${s === z.status ? "an" : ""}">${esc(s)}</button>`).join("");
  $("#clipsListe").innerHTML = z.daten.length ? z.daten.map(k => `<div class="karte" data-id="${esc(k.id)}">
      <div class="kopf"><span>${esc(k.kanal || "")} · ${esc(formatVon(k) || k.art || "")}</span><span class="status">${esc(k.status || "")}</span></div>
      <div class="titel">${esc(k.titel)}</div>${ampel(k)}
      <div class="reihe"><button class="klein" data-x="play">Ansehen</button></div>
      <div class="platzhalter"></div></div>`).join("") : `<p class="leer">Keine Clips gefunden.</p>`;
  $("#clipsMehr").innerHTML = data.length === SEITE ? `<button style="width:100%" id="mehrBtn">Mehr laden</button>` : "";
  if ($("#mehrBtn")) $("#mehrBtn").onclick = () => { z.seite++; clipsListe(ziel, true); };
  $("#clipsListe").onclick = async e => {
    const x = e.target.dataset?.x; if (!x) return;
    const div = e.target.closest(".karte"), k = z.daten.find(d => String(d.id) === div.dataset.id);
    // Lazy: Video erst beim Tippen laden, jeweils nur eines gleichzeitig.
    document.querySelectorAll("#clipsListe video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); v.remove(); });
    const u = await signiert(BUCKET_VORSCHAU, vorschauPfad(k));
    if (!u) return toast("Keine Vorschau online.");
    const v = document.createElement("video"); v.controls = true; v.playsInline = true; v.preload = "metadata"; v.src = u; v.style.cssText = "width:100%;max-height:60vh;background:#000;border-radius:10px;margin-top:8px";
    div.querySelector(".platzhalter").append(v); v.play().catch(() => {});
  };
}

// ---------- Prüfen: Review-Queue (Wischen, Tasten, Notiz) ----------
const GRUENDE = { ton: "Ton asynchron", lang: "Zu lang", kurz: "Zu kurz", langweilig: "Langweilig", titel: "Titel schlecht", text: "Untertitel falsch", schnitt: "Schnitt unsauber", kontext: "Kontext fehlt" };
let queue = [], gewaehlt = new Set();
async function pruefenQueue(ziel) {
  const [{ data: karten, error }, { data: wartend }] = await Promise.all([
    sb.from("karten").select("*").eq("status", "pruefen").order("zeit", { ascending: false }),
    sb.from("auftraege").select("karte_id").is("erledigt", null)]);
  if (error) return ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`;
  const schon = new Set((wartend || []).map(a => a.karte_id));
  queue = karten.filter(k => !schon.has(k.id));
  gewaehlt = new Set();
  naechste(ziel, queue.length);
}
async function naechste(ziel, gesamt) {
  ziel = ziel || $("#inhalt");
  if (ansicht !== "pruefen") return;
  const k = queue[0];
  if (!k) return ziel.innerHTML = `<p class="leer">Nichts mehr zu prüfen. Der PC arbeitet die Entscheidungen ab, sobald er an ist. 🎉</p>`;
  gewaehlt = new Set(); window.scrollTo(0, 0);
  ziel.innerHTML = `<div class="zaehler"><span>Noch ${queue.length} offen</span><button class="klein" id="spaeter">Später</button></div>
    <div class="karte stapel" id="stapel">
      <div class="platz" id="platz">Lade Video …</div>
      <div class="kopf"><span>${esc(k.kanal)} · ${esc(k.art || "")}</span><span>${k.punkte ? esc(k.punkte) + " Punkte" : ""}</span></div>
      <div class="titel">${esc(k.titel)}</div>
      ${ampel(k)}
      <div class="caption">${esc(k.caption)}</div>
      ${(k.hinweise || []).map(h => `<div class="hinweis">• ${esc(h)}</div>`).join("")}
    </div>
    <div class="karte">
      <div class="gruende">${Object.entries(GRUENDE).map(([i, t]) => `<button data-g="${i}">${t}</button>`).join("")}</div>
      <div class="mehr"><textarea id="notiz" placeholder="Notiz (warum, was ändern). Fließt ins Regelwerk ein."></textarea><input id="neuerTitel" placeholder="Neuer Titel (optional)"></div>
      <div class="knoepfe3" style="margin-top:12px">
        <button class="nein" data-a="ablehnen">Verwerfen</button>
        <button data-a="ueberarbeiten">Überarbeiten</button>
        <button class="ja" data-a="behalten">Behalten</button>
      </div>
      <div class="knoepfe"><button class="posten" data-a="posten" style="grid-column:1/-1">Posten (nächster Slot)</button></div>
      <div class="tipp">Karte wischen: rechts behalten, links verwerfen, hoch überarbeiten.</div>
      <div class="tipp tastenhilfe">Tasten: J behalten · K verwerfen · R überarbeiten · P posten · Leertaste Play · N Notiz</div>
    </div>`;
  // Video erst für die aktuelle Karte laden, die nächste Signatur schon vorholen (Video selbst bleibt ungeladen).
  signiert(BUCKET_VORSCHAU, vorschauPfad(k)).then(u => {
    const p = $("#platz"); if (!p || queue[0] !== k) return;
    if (!u) return p.textContent = "Keine Vorschau online";
    const v = document.createElement("video"); v.controls = true; v.playsInline = true; v.preload = "metadata"; v.src = u;
    v.style.cssText = "width:100%;max-height:60vh;background:#000;border-radius:10px;display:block";
    v.onloadedmetadata = () => { const a = $("#stapel .ampel"); if (a) a.outerHTML = ampel(k, v.duration); };
    p.replaceWith(v); v.id = "video";
  });
  if (queue[1]) signiert(BUCKET_VORSCHAU, vorschauPfad(queue[1]));
  $("#spaeter").onclick = () => { queue.push(queue.shift()); naechste(); };
  ziel.querySelectorAll(".gruende [data-g]").forEach(b => b.onclick = () => { const g = b.dataset.g; gewaehlt.has(g) ? gewaehlt.delete(g) : gewaehlt.add(g); b.classList.toggle("an"); });
  ziel.querySelectorAll("[data-a]").forEach(b => b.onclick = () => entscheide(b.dataset.a));
  wischen($("#stapel"));
}
async function entscheide(aktion) {
  const k = queue[0]; if (!k || entscheide.laeuft) return;
  const notiz = $("#notiz").value.trim(), titel = $("#neuerTitel").value.trim();
  if (aktion === "ueberarbeiten" && !notiz) { $("#notiz").focus(); return toast("Bei Überarbeiten bitte kurz sagen, was geändert werden soll."); }
  entscheide.laeuft = true;
  try {
    const { data: s } = await sb.auth.getSession();
    // Gründe stehen als [gründe: ton, lang] vor der Notiz, so kann der PC sie fürs Regelwerk auslesen, ohne neue Spalte.
    const gr = gewaehlt.size ? `[gründe: ${[...gewaehlt].join(", ")}] ` : "";
    const marker = aktion === "posten" ? MARKER + " " : "";
    const echt = aktion === "posten" ? "behalten" : aktion;
    const { data, error } = await sb.from("auftraege").insert({ karte_id: k.id, aktion: echt, kommentar: (marker + gr + notiz).trim(), titel: titel || null, von: s.session.user.id }).select("id").maybeSingle();
    if (error) return toast("Fehler: " + error.message);
    queue.shift();
    naechste();
    toast({ behalten: "Behalten", ablehnen: "Verworfen", ueberarbeiten: "Zum Überarbeiten", posten: "Zum Posten" }[aktion], data?.id ? async () => {
      const { error: e } = await sb.from("auftraege").delete().eq("id", data.id).is("erledigt", null);
      if (e) return toast("Rückgängig nicht möglich: " + e.message);
      queue.unshift(k); naechste();
    } : null);
  } finally { entscheide.laeuft = false; }
}
function wischen(el) {
  let x0, y0, dx = 0, dy = 0, aktiv = false;
  const schwelle = 90;
  el.addEventListener("touchstart", e => {
    if (e.target.closest("video,textarea,input,button")) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; aktiv = true; el.classList.add("ziehen");
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (!aktiv) return;
    dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0;
    if (Math.abs(dy) > Math.abs(dx) * 1.4 && dy > -20) { aktiv = false; el.style.transform = ""; el.className = "karte stapel"; return; }   // normales Scrollen
    el.style.transform = `translate(${dx}px,${Math.min(0, dy)}px) rotate(${dx / 30}deg)`;
    el.classList.toggle("t-ja", dx > schwelle); el.classList.toggle("t-nein", dx < -schwelle); el.classList.toggle("t-edit", dy < -schwelle && Math.abs(dx) < schwelle);
  }, { passive: true });
  el.addEventListener("touchend", () => {
    if (!aktiv) return; aktiv = false;
    el.classList.remove("ziehen", "t-ja", "t-nein", "t-edit"); el.style.transform = "";
    if (dx > schwelle) entscheide("behalten");
    else if (dx < -schwelle) entscheide("ablehnen");
    else if (dy < -schwelle) entscheide("ueberarbeiten");
  });
}
document.addEventListener("keydown", e => {
  if (ansicht !== "pruefen" || e.ctrlKey || e.metaKey || e.altKey || !$("#stapel")) return;
  if (e.target.closest?.("textarea,input")) { if (e.key === "Escape") e.target.blur(); return; }
  const m = { j: "behalten", ArrowRight: "behalten", k: "ablehnen", ArrowLeft: "ablehnen", r: "ueberarbeiten", p: "posten" }[e.key];
  if (m) { e.preventDefault(); return entscheide(m); }
  if (e.key === "n") { e.preventDefault(); $("#notiz").focus(); }
  if (e.key === " ") { e.preventDefault(); const v = $("#video"); if (v) v.paused ? v.play() : v.pause(); }
});
start();
</script>
