<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Clipwreck</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/clipwreck-192.png">
<link rel="apple-touch-icon" href="icons/clipwreck-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Clipwreck">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070d">
<meta property="og:title" content="Clipwreck">
<meta property="og:image" content="https://fidg0.github.io/clips-pruefen/icons/og-bild.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;650;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* 24.11.2026 abends: gleicher HUD-Look wie die Zentrale am PC (Sendezentrale). Variablennamen bleiben, das Skript nutzt sie. */
  :root { --bg:#05070d; --karte:rgba(12,18,32,.86); --linie:#1c2b44; --linie2:#2a4266; --text:#e6f1ff; --leise:#7f93b2;
          --gruen:#3dff9a; --rot:#ff2a4b; --gelb:#ffd23f; --cyan:#25e2ff; --magenta:#ff3bd4;
          --display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; color-scheme:dark; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background-image:radial-gradient(700px 400px at 100% -5%,rgba(37,226,255,.09),transparent 60%),radial-gradient(600px 400px at -10% 105%,rgba(255,59,212,.08),transparent 60%),
      linear-gradient(rgba(37,226,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(37,226,255,.035) 1px,transparent 1px);
    background-size:auto,auto,28px 28px,28px 28px; background-attachment:fixed; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
  a { color:var(--cyan); }
  header { position:sticky; top:0; z-index:5; background:rgba(5,7,13,.97); padding:10px 16px 0; border-bottom:1px solid var(--linie); }
  header h1 { margin:0; font-family:var(--display); font-size:19px; letter-spacing:2px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1::before { content:""; width:26px; height:26px; border-radius:50%; background:url(icons/clipwreck-180.png) center/cover; box-shadow:0 0 0 2px var(--rot),0 0 14px rgba(255,42,75,.45); flex:none; }
  header::after { content:""; display:block; height:2px; margin:10px -16px 0; background:linear-gradient(90deg,var(--cyan) 0 20%,var(--gruen) 20% 40%,var(--magenta) 40% 60%,var(--rot) 60% 80%,var(--gelb) 80%); opacity:.8; }
  #pcstand { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--leise); font-weight:400; letter-spacing:0; }
  /* Reiter unten, mit dem Daumen erreichbar */
  nav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:2px; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
        background:rgba(5,7,13,.95); backdrop-filter:blur(10px); border-top:1px solid var(--linie); overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:1 0 auto; padding:9px 12px; font-family:var(--display); font-size:13px; font-weight:600; letter-spacing:.4px; border-color:transparent; background:transparent; color:#b9c8df; }
  nav button.an { color:#fff; background:linear-gradient(180deg,rgba(255,42,75,.25),rgba(255,42,75,.06)); border-color:rgba(255,42,75,.5); box-shadow:inset 0 -2px 0 var(--rot); }
  main { padding:14px 16px 40px; max-width:560px; margin:0 auto; }
  h3 { font-family:var(--display); font-size:13px; letter-spacing:1.3px; text-transform:uppercase; color:#9fb6d6; margin:18px 0 8px; }
  button, input, textarea { font:inherit; color:inherit; }
  button { background:rgba(16,26,44,.9); border:1px solid var(--linie2); border-radius:4px; padding:10px 12px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:active { transform:scale(.98); }
  button.an { border-color:var(--cyan); color:var(--cyan); }
  button.ja { background:rgba(61,255,154,.16); color:#d6ffe9; border:1px solid var(--gruen); font-weight:700; font-family:var(--display); letter-spacing:.4px; }
  button.nein { background:rgba(255,42,75,.12); border-color:var(--rot); color:#ffc2cc; font-weight:700; font-family:var(--display); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--gelb); outline-offset:2px; }
  input, textarea { width:100%; background:rgba(5,7,13,.9); border:1px solid var(--linie2); border-radius:4px; padding:10px; }
  input:focus, textarea:focus { border-color:var(--cyan); outline:none; box-shadow:0 0 14px rgba(37,226,255,.25); }
  textarea { min-height:64px; resize:vertical; }
  .karte { position:relative; background:var(--karte); border:1px solid var(--linie); border-radius:3px; padding:12px; margin-bottom:16px;
    background-image:linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan)),linear-gradient(var(--cyan),var(--cyan));
    background-repeat:no-repeat; background-size:12px 1px,1px 12px,12px 1px,1px 12px; background-position:-1px -1px,-1px -1px,calc(100% + 1px) calc(100% + 1px),calc(100% + 1px) calc(100% + 1px); }
  .karte video { width:100%; max-height:70vh; background:#000; border-radius:2px; display:block; border:1px solid var(--linie2); }
  .kopf { display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:12px; color:var(--leise); margin:8px 0 2px; }
  .titel { font-weight:650; margin:2px 0 6px; }
  .caption { white-space:pre-wrap; font-size:14px; color:var(--leise); max-height:7em; overflow:auto; }
  .hinweis { font-size:13px; color:var(--gelb); margin-top:6px; }
  .knoepfe { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .knoepfe .posten { grid-column:1 / -1; }
  .mehr { margin-top:8px; display:grid; gap:8px; }
  .leer { color:var(--leise); text-align:center; padding:40px 0; }
  .zeile { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--linie); font-size:14px; }
  .zeile span:last-child { color:var(--leise); white-space:nowrap; font-family:var(--mono); font-size:12px; }
  #login { display:grid; gap:10px; margin-top:16vh; }
  #login::before { content:"Sendezentrale"; font-family:var(--display); font-size:28px; font-weight:700; letter-spacing:1px; text-align:center; text-shadow:0 0 18px rgba(37,226,255,.35); margin-bottom:8px; }
  .fehler { color:var(--rot); font-size:14px; }
  #abmelden { margin-left:auto; color:var(--leise); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .chips button { flex:0 0 auto; padding:6px 12px; border-radius:3px; font-size:14px; }
  .chips button.an { background:rgba(37,226,255,.14); color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 12px rgba(37,226,255,.25); }
  .suche { margin-bottom:8px; }
  .ampel { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 2px; font-size:12px; color:var(--leise); }
  .ampel span { display:inline-flex; align-items:center; gap:5px; }
  button.posten:disabled { opacity:.55; cursor:not-allowed; }
  .ampel i { width:10px; height:10px; border-radius:50%; background:#33415a; display:inline-block; }
  .ampel .gruen i { background:var(--gruen); box-shadow:0 0 8px var(--gruen); } .ampel .gelb i { background:var(--gelb); box-shadow:0 0 8px var(--gelb); } .ampel .rot i { background:var(--rot); box-shadow:0 0 8px var(--rot); }
  .stapel { position:relative; touch-action:pan-y; transition:transform .18s ease, box-shadow .18s; will-change:transform; }
  .stapel.ziehen { transition:none; }
  .stapel.t-ja { box-shadow:0 0 0 2px var(--gruen),0 0 30px rgba(61,255,154,.35); } .stapel.t-nein { box-shadow:0 0 0 2px var(--rot),0 0 30px rgba(255,42,75,.35); } .stapel.t-edit { box-shadow:0 0 0 2px var(--gelb),0 0 30px rgba(255,210,63,.3); }
  .zaehler { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:13px; color:var(--cyan); margin-bottom:8px; }
  .gruende { display:flex; flex-wrap:wrap; gap:6px; }
  .gruende button { padding:6px 10px; font-size:13px; border-radius:3px; }
  .gruende button.an { border-color:var(--gelb); color:var(--gelb); background:rgba(255,210,63,.1); }
  .tipp { font-size:12px; color:var(--leise); text-align:center; margin-top:10px; }
  .tastenhilfe { display:none; }
  @media (hover:hover) and (pointer:fine) { .tastenhilfe { display:block; } }
  .knoepfe3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
  .knoepfe3 button { padding:14px 6px; font-family:var(--display); font-weight:700; letter-spacing:.4px; }
  .klein { padding:6px 10px; font-size:13px; }
  .reihe { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .status { font-size:11px; border:1px solid var(--linie2); border-radius:2px; padding:1px 7px; }
  #toast { position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#101a2c; border:1px solid var(--cyan); box-shadow:0 0 18px rgba(37,226,255,.3); border-radius:4px; padding:10px 14px; display:flex; gap:12px; align-items:center; z-index:20; max-width:92vw; }
  .platz { aspect-ratio:9/16; max-height:60vh; width:100%; background:#000; border-radius:2px; display:grid; place-items:center; color:var(--leise); font-size:14px; border:1px solid var(--linie2); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
  .tvhuelle { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .tvbox { background:var(--bg); border:1px solid var(--linie2); width:100%; max-width:640px; max-height:92vh; overflow:auto; padding:14px; border-radius:6px 6px 0 0; box-sizing:border-box; }
  .tvkopf { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:8px; }
  .tvkopf span { font-family:var(--mono); font-size:12px; color:var(--gelb); text-align:right; }
  .tvtabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
  .tvtabs button.an { border-color:var(--cyan); color:var(--cyan); }
  .tvlab { display:block; font-size:12px; color:var(--leise); margin:10px 0 4px; }
  .tvbox input, .tvbox textarea { width:100%; box-sizing:border-box; font:inherit; font-size:16px; }
  .tvbox pre { white-space:pre-wrap; font-family:inherit; font-size:13px; background:var(--karte); border:1px solid var(--linie); padding:8px; margin:0; max-height:28vh; overflow:auto; }
  .tvwarn { font-size:13px; color:var(--gelb); margin:4px 0; }
  .tvfehler { font-size:13px; color:var(--rot); margin:6px 0; min-height:1em; }
  @media (min-width:700px) { .tvhuelle { align-items:center; } .tvbox { border-radius:6px; } }
</style>
</head>
<body>
<header>
  <h1>Clipwreck <span id="pcstand"></span></h1>
  <nav id="nav" hidden>
    <button data-ansicht="pruefen" class="an">Prüfen</button>
    <button data-ansicht="clips">Clips</button>
    <button data-ansicht="fertig">Fertig</button>
    <button data-ansicht="erledigt">Erledigt</button>
    <button data-ansicht="videos">Videos</button>
    <button data-ansicht="posting">Posting</button>
    <button id="abmelden">Abmelden</button>
  </nav>
</header>
<main>
  <form id="login" hidden>
    <input id="mail" type="email" autocomplete="username" placeholder="E-Mail" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="ja" type="submit">Anmelden</button>
    <div id="loginfehler" class="fehler"></div>
  </form>
  <div id="inhalt"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_ = "https://ycmecdixsdfhcspqeinw.supabase.co";
const KEY = "sb_publishable_cyLyZvgu7N2RbPv58E7aBA_AigcopE6";   // öffentlich gedacht, Schutz über Login + Zeilenschutz
const sb = supabase.createClient(URL_, KEY);
let ansicht = "pruefen";
let fertigAlle = false;   // 24.11.: Fertig-Reiter zeigt Clips mit Ton-Fehler erst auf Wunsch
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function start() {
  const { data } = await sb.auth.getSession();
  $("#login").hidden = !!data.session; $("#nav").hidden = !data.session;
  if (data.session) zeige();
}
$("#login").onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("#mail").value.trim(), password: $("#pw").value });
  $("#loginfehler").textContent = error ? "Anmeldung fehlgeschlagen: " + error.message : "";
  if (!error) start();
};
$("#abmelden").onclick = async () => { await sb.auth.signOut(); $("#inhalt").innerHTML = ""; start(); };
document.querySelectorAll("nav [data-ansicht]").forEach(b => b.onclick = () => {
  ansicht = b.dataset.ansicht; document.querySelectorAll("nav [data-ansicht]").forEach(x => x.classList.toggle("an", x === b)); zeige();
});

async function pcStand() {
  const { data } = await sb.from("info").select("wert").eq("schluessel", "pc").maybeSingle();
  const t = data?.wert?.letzter_abgleich;
  if (!t) return $("#pcstand").textContent = "";
  const min = Math.round((Date.now() / 1000 - t) / 60);
  const an = min <= 2;
  $("#pcstand").innerHTML = an ? `<a href="${PC}" style="color:var(--gruen)">PC an: volles Dashboard</a>` : "PC aus (zuletzt vor " + (min < 120 ? min + " Min" : Math.round(min / 60) + " Std") + ")";
  // Eine Adresse für alles: PC an = einmal pro Sitzung automatisch ins volle Dashboard (über Tailscale).
  // Klappt das nicht (Tailscale-App aus), führt „Zurück“ hierher und es wird nicht erneut umgeleitet.
  const bleiben = new URLSearchParams(location.search).has("pruefen");
  let versucht = false; try { versucht = sessionStorage.getItem("pc_versucht") === "1"; } catch (e) {}
  if (an && !bleiben && !versucht) {
    try { sessionStorage.setItem("pc_versucht", "1"); } catch (e) {}
    location.href = PC;
  }
}
const PC = "http://100.93.141.24:8800/";
const MARKER = "[posten]";

async function zeige() {
  pcStand();
  const ziel = $("#inhalt");
  if (ansicht === "videos") {
    const { data } = await sb.from("info").select("wert").eq("schluessel", "videos").maybeSingle();
    const a = data?.wert?.aktuell, l = data?.wert?.liste || [];
    ziel.innerHTML = (a ? `<div class="karte"><b>Gerade in Arbeit:</b> ${esc(a.titel)} <span style="color:var(--leise)">· ${esc(a.kanal)}</span><br>Schritt: ${esc(a.schritt)}${a.fortschritt != null ? " · " + a.fortschritt + " %" : ""}</div>`
      : `<p class="leer" style="padding:12px 0">Gerade kein Video in Arbeit.</p>`)
      + l.map(v => `<div class="zeile"><span><b style="color:${v.ergebnis === "genommen" ? "var(--gruen)" : "var(--leise)"}">${esc(v.ergebnis)}</b> ${esc(v.titel)}<br><small>${esc(v.grund)}</small></span><span>${esc(v.kanal)}</span></div>`).join("");
    return;
  }
  if (ansicht === "posting") {
    const [{ data: p }, { data: a }] = await Promise.all([
      sb.from("info").select("wert").eq("schluessel", "posting").maybeSingle(),
      sb.from("info").select("wert").eq("schluessel", "auswertung").maybeSingle()]);
    const po = p?.wert || {}, au = a?.wert || {};
    const farbe = { geplant: "var(--gelb)", gesendet: "var(--gruen)", fehler: "var(--rot)", probelauf: "var(--leise)" };
    const zeile = g => `<div class="zeile"><span><b style="color:${farbe[g.status] || "var(--leise)"}">${esc(g.status)}</b> ${esc({ tiktok: "TikTok", youtube: "YouTube", instagram: "Insta" }[g.plattform || "tiktok"] || g.plattform)} · ${esc(g.titel)}${g.fehler ? "<br><small style='color:var(--rot)'>" + esc(g.fehler) + "</small>" : ""}${g.hinweis ? "<br><small style='color:var(--gelb)'>" + esc(g.hinweis) + "</small>" : ""}</span><span>${esc(g.slot_lokal)}</span></div>`;
    const kommend = (po.geplant || []).filter(g => g.status !== "gesendet").slice(-20).reverse();
    const gesendet = (po.geplant || []).filter(g => g.status === "gesendet").slice(-10).reverse();
    ziel.innerHTML = `<div class="karte"><b>Modus:</b> ${po.modus === "live" ? "<span style='color:var(--gruen)'>live (Buffer)</span>" : "Probelauf, es wird nichts gepostet"}
        ${po.letzter_lauf ? "<br><small style='color:var(--leise)'>Letzter Lauf: " + new Date(po.letzter_lauf).toLocaleString("de-DE") + "</small>" : ""}</div>`
      + ((po.probelauf || []).length ? `<h3>Würde geplant (Probelauf)</h3>` + po.probelauf.map(zeile).join("") : "")
      + ((po.gesperrt || []).length ? `<h3>Gesperrt (wird alle 15 Min neu geprüft)</h3>` + po.gesperrt.map(g => `<div class="zeile"><span>${esc(g.titel)}<br><small style="color:var(--rot)">${esc(g.grund)}</small></span><span></span></div>`).join("") : "")
      + `<h3>Geplant</h3>` + (kommend.length ? kommend.map(zeile).join("") : `<p class="leer" style="padding:12px 0">Nichts geplant.</p>`)
      + (gesendet.length ? `<h3>Gesendet</h3>` + gesendet.map(zeile).join("") : "")
      + `<h3>Zahlen</h3>` + (au.anzahl_posts ? `<div class="karte">${au.anzahl_posts} Posts · Median ${Math.round(au.median_views_d3 || 0).toLocaleString("de-DE")} Views (Tag 3)
          ${(au.vorschlaege || []).map(t => `<div class="hinweis">• ${esc(t)}</div>`).join("")}</div>`
          + (au.top || []).map(t => `<div class="zeile"><span>${esc(t.titel)}<br><small>${esc(t.plattform || "")} · ${esc(t.art || "")} · ${esc(t.slot || "")}</small></span><span>${Math.round(t.views_d3).toLocaleString("de-DE")}</span></div>`).join("")
        : `<p class="leer" style="padding:12px 0">Noch keine Zahlen.</p>`);
    return;
  }
  if (ansicht === "erledigt") {
    const { data, error } = await sb.from("auftraege").select("id,aktion,kommentar,erstellt,erledigt,ergebnis,karten(titel)").order("id", { ascending: false }).limit(40);
    if (error) return ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`;
    const name = { behalten: "Behalten", ablehnen: "Nicht behalten", ueberarbeiten: "Überarbeiten" };
    ziel.innerHTML = data.length ? data.map(a => { const p = (a.kommentar || "").startsWith(MARKER); const w = p ? (a.kommentar.match(/slot:[a-z]+=(\S+)/) || [])[1] : null;
      const kom = p ? a.kommentar.slice(MARKER.length).replace(/slot:[a-z]+=\S+/g, "").trim() + (w ? (" (Slot " + new Date(w).toLocaleString("de-DE", { timeZone: "Europe/Berlin", weekday: "short", hour: "2-digit", minute: "2-digit" }) + ")") : "") : a.kommentar;
      return `<div class="zeile"><span>${p ? "Posten" : name[a.aktion]}: ${esc(a.karten?.titel)}${kom ? "<br><small>„" + esc(kom) + "“</small>" : ""}</span>
      <span>${a.erledigt ? "am PC erledigt" : "wartet auf PC"}</span></div>`; }).join("") : `<p class="leer">Noch keine Entscheidungen.</p>`;
    return;
  }
  if (ansicht === "fertig") {   // 24.11.: neu gerenderte Originale (Bucket fertig, karten.datei), auch bei ausgeschaltetem PC
    const [{ data: alle, error }, { data: fr }] = await Promise.all([
      sb.from("karten").select("*").not("datei", "is", null).order("zeit", { ascending: false }),
      sb.from("auftraege").select("karte_id").eq("aktion", "behalten").like("kommentar", MARKER + "%")]);
    if (error) return ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`;
    const freigegeben = new Set((fr || []).map(a => a.karte_id));
    if (!alle.length) return ziel.innerHTML = `<p class="leer">Noch keine fertigen Clips in der Cloud. Der PC lädt sie nach und nach hoch.</p>`;
    // 24.11.: Ton-Ampel rot oder gelb = Ton defekt. Standardmäßig ausgeblendet, kommt nach grünem Neu-Render von selbst zurück.
    const tonSt = c => c.checks?.ton_sync?.status || "grau";
    const defekt = c => ["rot", "gelb"].includes(tonSt(c));
    const nDefekt = alle.filter(defekt).length;
    const k = fertigAlle ? alle : alle.filter(c => !defekt(c));
    ziel.innerHTML = `<p style="color:var(--leise);font-size:14px">${k.length} neu gerenderte Clips, auch ohne PC. Video lädt erst beim Antippen.</p>`
      + (nDefekt ? `<p style="border:1px solid #e5484d;border-radius:10px;padding:10px;font-size:14px"><b>${nDefekt} Clips mit Ton-Fehler</b> ${fertigAlle ? "werden angezeigt" : "sind ausgeblendet"}. Sie werden neu gerendert und erscheinen von selbst wieder, sobald der Ton grün ist.

const BUCKET_VORSCHAU = "vorschau";
const urlCache = new Map();
async function signiert(bucket, pfad, download) {
  if (!pfad) return null;
  const key = bucket + "|" + pfad + "|" + (download || "");
  const c = urlCache.get(key);
  if (c && c.bis > Date.now()) return c.url;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(pfad, 3600, download ? { download } : undefined);
  if (error || !data) return null;
  urlCache.set(key, { url: data.signedUrl, bis: Date.now() + 3300 * 1000 });
  return data.signedUrl;
}

const GLUECKSSPIEL = ["casino", "glücksspiel", "gluecksspiel", "gambling", "gamble", "gamblen", "roulette", "blackjack", "poker", "slots", "slot machine", "slotmaschine", "spielautomat", "sportwette", "sportwetten", "wette", "wetten", "stake", "jackpot", "freispiel", "freispiele", "bonus buy", "lootbox", "case opening", "crash game"];

// 25.11.: Slot selbst wählen (wie der Kalender in der Zentrale). Gleiche Regeln wie automation/lib.py slot_pruefen:
// 4 feste Slots plus Bonus 22:00 (Berliner Zeit), 30 Min Vorlauf, frei auf allen drei Plattformen, max. 5 pro Tag. posten.py prüft nochmal.
const SLOTS = ["13:00", "16:00", "19:00", "20:30", "22:00"], BONUS = ["22:00"], PLATTF = ["tiktok", "youtube", "instagram"], VORLAUF_MIN = 30, MAX_TAG = 5, BUFFER_MAX = 10;
let slotCache = { t: 0, geplant: [] };
function berlinUtc(datum, hhmm) {   // "2026-11-26", "16:00" (Berliner Wanduhr) -> Date in UTC, unabhängig von der Handy-Zeitzone
  const [y, m, d] = datum.split("-").map(Number), [h, mi] = hhmm.split(":").map(Number);
  let t = Date.UTC(y, m - 1, d, h, mi);
  for (let i = 0; i < 2; i++) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
      .formatToParts(new Date(t)).map(x => [x.type, x.value]));
    t += Date.UTC(y, m - 1, d, h, mi) - Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute);
  }
  return new Date(t);
}
function berlinTag(date) { return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" }).format(date); }
async function slotsFuellen() {
  if (!document.querySelector("#slotWahl, select.fslot")) return;
  if (Date.now() - slotCache.t > 60000) {
    const { data } = await sb.from("info").select("wert").eq("schluessel", "posting").maybeSingle();
    slotCache = { t: Date.now(), geplant: (data?.wert?.geplant || []).filter(g => ["geplant", "gesendet"].includes(g.status)) };
  }
  const belegt = p => new Set(slotCache.geplant.filter(g => (g.plattform || "tiktok") === p).map(g => new Date(g.slot_utc).getTime()));
  const B = Object.fromEntries(PLATTF.map(p => [p, belegt(p)]));
  const frueh = Date.now() + VORLAUF_MIN * 60000, opt = [];
  for (let i = 0; i < 8 && opt.length < 12; i++) {
    const tag = berlinTag(new Date(Date.now() + i * 86400000));
    for (const s of SLOTS) {
      const t = berlinUtc(tag, s);
      const frei = t.getTime() >= frueh && PLATTF.every(p => !B[p].has(t.getTime())
        && [...B[p]].filter(x => berlinTag(new Date(x)) === tag).length < MAX_TAG);
      if (frei) opt.push(`<option value="${t.toISOString()}">${t.toLocaleString("de-DE", { timeZone: "Europe/Berlin", weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}${BONUS.includes(s) ? " ★ Bonus" : ""}</option>`);
    }

  const voll = PLATTF.filter(p => slotCache.geplant.filter(g => (g.plattform || "tiktok") === p && g.status === "geplant" && new Date(g.slot_utc) > new Date()).length >= BUFFER_MAX);

  opt.unshift(`<option value="sofort">⚡ Bonus jetzt sofort posten${bonusWarnungen().length ? " (mit Hinweis)" : ""}</option>`);
  if (voll.length) opt.unshift(`<option disabled>Buffer Free voll (${BUFFER_MAX} geplant): Freigabe wartet, bis ein Post raus ist</option>`);
  document.querySelectorAll("#slotWahl, select.fslot").forEach(sel => { if (!sel.dataset.gefuellt) { sel.dataset.gefuellt = "1"; sel.insertAdjacentHTML("beforeend", opt.join("")); } });
}

  const menue = auf => {
    nav.classList.toggle("auf", auf); knopf.setAttribute("aria-expanded", auf ? "true" : "false"); document.querySelector(".h2schleier")?.remove();
    if (auf) { nav.style.top = (kopf.getBoundingClientRect().bottom + 6) + "px"; const s = document.createElement("div"); s.className = "h2schleier"; s.onclick = () => menue(false); document.body.append(s); }
  };
  knopf.onclick = () => menue(!nav.classList.contains("auf"));
  nav.addEventListener("click", e => { if (e.target.closest("button")) { menue(false); setTimeout(beschriften, 0); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && nav.classList.contains("auf")) menue(false); });
  // Menü-Knopf nur angemeldet (folgt dem hidden der Reiter, das start() setzt)
  const sichtbar = () => { knopf.hidden = nav.hidden; if (nav.hidden) menue(false); };
  new MutationObserver(sichtbar).observe(nav, { attributes: true, attributeFilter: ["hidden"] }); sichtbar(); beschriften();

  // Seitenwechsel: kurzer Aufbau, Cockpit als eigene Ansicht
  const _zeige = zeige; let vorher = null;
  zeige = async function () {
    beschriften();
    const ziel = $("#inhalt"), neu = vorher !== ansicht; vorher = ansicht;
    if (ansicht === "cockpit") { pcStand(); await cockpit(ziel); }
    else { await _zeige(); await zusatz(ansicht, ziel).catch(() => {}); }
    if (neu) { ziel.classList.remove("h2an"); void ziel.offsetWidth; ziel.classList.add("h2an"); setTimeout(() => ziel.classList.remove("h2an"), 1200); }
  };

  const F = { cyan: "#25e2ff", gruen: "#3dff9a", magenta: "#ff3bd4", rot: "#ff2a4b", gelb: "#ffd23f", grau: "#56657d", linie: "#1c2b44" };
  const z = n => Number(n || 0).toLocaleString("de-DE");
  function donut(teile, mitte, unter) {
    const sum = teile.reduce((a, t) => a + t.n, 0) || 1, r = 52, u = 2 * Math.PI * r; let off = 0;
    let s = `<svg viewBox="0 0 140 140" role="img" aria-label="${esc(unter)}"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#18253b" stroke-width="13"/>`;
    teile.forEach(t => { if (!t.n) return; const len = u * t.n / sum;
      s += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${t.f}" stroke-width="13" stroke-dasharray="${Math.max(.5, len - 2)} ${u}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" style="filter:drop-shadow(0 0 4px ${t.f})"/>`; off += len; });
    return s + `<text x="70" y="74" text-anchor="middle" class="h2dv">${mitte}</text><text x="70" y="91" text-anchor="middle" class="h2dl">${esc(unter)}</text></svg>`;
  }
  async function cockpit(ziel, nurDaten) {
    if (!nurDaten) ziel.innerHTML = `<p class="leer" style="padding:20px 0">Lade Cockpit …</p>`;
    const [{ data: karten, error }, { data: po }, { data: au }] = await Promise.all([
      sb.from("karten").select("id,status,kanal,punkte,checks,datei,titel").limit(1000),
      sb.from("info").select("wert").eq("schluessel", "posting").maybeSingle(),
      sb.from("info").select("wert").eq("schluessel", "auswertung").maybeSingle()]);
    if (!nurDaten && ansicht !== "cockpit") return;
    if (error) return nurDaten ? null : ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`;
    const k = karten || [], g = po?.wert?.geplant || [], a = au?.wert || {};
    const offen = k.filter(x => x.status === "pruefen").length, fertig = k.filter(x => x.datei);
    const postbar = fertig.filter(x => !sperrgrund(x)).length;
    const geplant = g.filter(x => x.status === "geplant"), gesendet = g.filter(x => x.status === "gesendet");
    // Ton-Ampel der fertigen Clips
    const ton = { gruen: 0, gelb: 0, rot: 0, grau: 0 }; fertig.forEach(x => { const s = x.checks?.ton_sync?.status || "grau"; ton[s in ton ? s : "grau"]++; });
    const tonSum = Object.values(ton).reduce((p, q) => p + q, 0);
    // Status-Verteilung
    const st = {}; k.forEach(x => { st[x.status || "?"] = (st[x.status || "?"] || 0) + 1; });
    const farbe = { pruefen: F.gelb, behalten: F.gruen, fertig: F.gruen, ueberarbeiten: F.magenta, abgelehnt: F.rot, weg: F.grau };
    const stListe = Object.entries(st).sort((p, q) => q[1] - p[1]);
    // Kalender-Auslastung 7 Tage x Slots, Berliner Zeit, je Slot belegte Plattformen
    const belegt = {}; g.filter(x => ["geplant", "gesendet"].includes(x.status)).forEach(x => { const d = new Date(x.slot_utc);
      const key = berlinTag(d) + " " + d.toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
      (belegt[key] || (belegt[key] = new Set())).add(x.plattform || "tiktok"); });
    const tage = [...Array(7)].map((_, i) => new Date(Date.now() + i * 86400000));
    const W = 360, L = 44, T = 18, cw = (W - L) / 7, ch = 24, H = T + SLOTS.length * ch + 4;
    let kal = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalender-Auslastung">`, voll = 0, ges = 0;
    tage.forEach((d, i) => { const tag = berlinTag(d), x = L + i * cw;
      kal += `<text x="${x + cw / 2}" y="11" text-anchor="middle" class="${i ? "" : "heute"}">${i ? d.toLocaleDateString("de-DE", { weekday: "short", timeZone: "Europe/Berlin" }).slice(0, 2) : "heute"}</text>`;
      SLOTS.forEach((sl, j) => { const n = belegt[tag + " " + sl]?.size || 0, b = BONUS.includes(sl), y = T + j * ch, c = b ? F.magenta : F.cyan;
        const vorbei = berlinUtc(tag, sl).getTime() < Date.now(); if (!vorbei && !b) { ges += 3; voll += Math.min(3, n); }
        kal += `<rect x="${x + 1.5}" y="${y + 1.5}" width="${cw - 3}" height="${ch - 3}" rx="2" fill="${n ? c : "transparent"}" fill-opacity="${n ? .2 + .5 * n / 3 : 0}" stroke="${n ? c : F.linie}" ${n ? "" : `stroke-dasharray="3 3"`} opacity="${vorbei ? .35 : 1}"/>`
          + (n ? `<text x="${x + cw / 2}" y="${y + ch / 2 + 3.5}" text-anchor="middle" class="h2cz">${n}/3</text>` : ""); }); });
    SLOTS.forEach((sl, j) => { kal += `<text x="${L - 6}" y="${T + j * ch + ch / 2 + 3.5}" text-anchor="end" style="${BONUS.includes(sl) ? `fill:${F.magenta}` : ""}">${sl}</text>`; });
    kal += `</svg>`;
    // Streamer: Clips je Kanal mit Ø Punkte
    const kan = {}; k.forEach(x => { if (!x.kanal) return; const o = kan[x.kanal] || (kan[x.kanal] = { n: 0, p: [] }); o.n++; if (x.punkte != null) o.p.push(+x.punkte); });
    const kanL = Object.entries(kan).sort((p, q) => q[1].n - p[1].n).slice(0, 7), kmax = Math.max(1, ...kanL.map(e => e[1].n));
    // 25.11. (Marvin: übersichtlicher): Cockpit nur kompakt, die Grafiken stehen in den Reitern, zu denen sie gehören
    H2c.kal = { svg: kal, q: ges ? Math.round(100 * voll / ges) : 0 }; H2c.ton = { ton, tonSum }; H2c.kanL = kanL; H2c.kmax = kmax; H2c.t = Date.now();
    ziel.innerHTML = `<div class="h2kpis">
        <div class="h2kpi ${offen ? "du" : ""}"><b>${z(offen)}</b><span>warten auf dein Ja</span></div>
        <div class="h2kpi gut"><b>${z(postbar)}</b><span>fertig und postbar</span></div>
        <div class="h2kpi"><b>${z(geplant.length)}</b><span>Posts geplant</span></div>
        <div class="h2kpi"><b>${a.anzahl_posts ? z(Math.round(a.median_views_d3 || 0)) : z(gesendet.length)}</b><span>${a.anzahl_posts ? "Median Aufrufe (Tag 3)" : "Posts gesendet"}</span></div></div>
      ${offen ? `<button class="ja" style="width:100%;margin-bottom:16px;padding:14px" id="h2los">Jetzt ${z(offen)} Clips prüfen</button>` : ""}
      <div class="karte"><h3>Wo die Clips stehen</h3><div class="h2stapel h2wachs">${stListe.map(([s, n]) => `<span style="width:${100 * n / (k.length || 1)}%;background:${farbe[s] || F.cyan};box-shadow:0 0 8px ${farbe[s] || F.cyan}" title="${esc(s)}: ${n}"></span>`).join("")}</div>
        <div class="leg">${stListe.map(([s, n]) => `<span><i style="background:${farbe[s] || F.cyan}"></i>${esc(s)} <b>${n}</b></span>`).join("")}</div>
        <div class="leg">Kalender ${H2c.kal.q} % belegt · Ton grün ${tonSum ? Math.round(100 * ton.gruen / tonSum) : 0} %</div></div>`;
    const los = $("#h2los"); if (los) los.onclick = () => nav.querySelector('[data-ansicht="pruefen"]').click();
  }
  // Grafiken in den passenden Reitern: Posting = Kalender, Fertig = Ton-Ampel, Clips = Streamer (zugeklappt)
  const H2c = {};
  async function daten() { if (!H2c.t || Date.now() - H2c.t > 30000) await cockpit(null, true); }
  async function zusatz(art, ziel) {
    if (!["posting", "fertig", "clips"].includes(art)) return;
    await daten(); if (ansicht !== art) return;
    let html = "";
    if (art === "posting" && H2c.kal) html = `<div class="karte"><h3>Kalender, 7 Tage</h3><div class="dia">${H2c.kal.svg}</div>
      <div class="leg"><span><i style="background:${F.cyan}"></i>belegt (TikTok, Shorts, Reels)</span><span><i style="background:${F.magenta}"></i>Bonus</span><span>Auslastung <b>${H2c.kal.q} %</b></span></div></div>`;
    if (art === "fertig" && H2c.ton?.tonSum) { const { ton, tonSum } = H2c.ton, t = [["gruen", "postbar", F.gruen], ["gelb", "gelb", F.gelb], ["rot", "rot", F.rot], ["grau", "ungemessen", F.grau]];
      html = `<div class="karte"><h3>Ton-Ampel</h3><div class="h2stapel h2wachs">${t.map(([k, n, c]) => `<span style="width:${100 * ton[k] / tonSum}%;background:${c};box-shadow:0 0 8px ${c}"></span>`).join("")}</div>
        <div class="leg">${t.map(([k, n, c]) => `<span><i style="background:${c}"></i>${n} <b>${ton[k]}</b></span>`).join("")}</div></div>`; }
    if (art === "clips" && H2c.kanL?.length) html = `<details class="karte"><summary style="cursor:pointer;font-family:var(--display);font-size:13px;letter-spacing:1.3px;text-transform:uppercase;color:#9fb6d6">Streamer</summary>
      ${H2c.kanL.map(([n, o]) => `<div class="h2balken"><span>${esc(n.slice(0, 13))}</span><div class="b"><i style="width:${100 * o.n / H2c.kmax}%"></i></div><span>${o.p.length ? Math.round(o.p.reduce((p, q) => p + q, 0) / o.p.length) : "–"}</span></div>`).join("")}
      <div class="leg"><span>Balken = Anzahl Clips, rechts Ø Punkte</span></div></details>`;
    if (html && !ziel.querySelector(".h2zusatz")) ziel.insertAdjacentHTML("afterbegin", `<div class="h2zusatz">${html}</div>`);
  }
  // Vorschau leiser (Marvin 25.11.): nur die Wiedergabe, Dateien und Posts bleiben unverändert. Start 45 %, eigener Regler-Wert wird gemerkt.
  const LAUT = () => { try { const v = parseFloat(localStorage.getItem("h2laut")); return isNaN(v) ? 0.45 : v; } catch (e) { return 0.45; } };
  const leise = e => { const v = e.target; if (v.tagName === "VIDEO" && !v.dataset.h2laut) { v.dataset.h2laut = "1"; v.volume = LAUT(); } };
  document.addEventListener("loadedmetadata", leise, true); document.addEventListener("play", leise, true);
  document.addEventListener("volumechange", e => { const v = e.target; if (v.tagName === "VIDEO" && v.dataset.h2laut && !v.muted) try { localStorage.setItem("h2laut", String(v.volume)); } catch (x) {} }, true);
})();
</script>
